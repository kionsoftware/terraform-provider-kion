kind: BUG FIXES
body: >-
  Migrating kion_ou_cloud_access_role and kion_project_cloud_access_role from
  the old provider's 0.3.36 no longer loses the role-type attributes it added
  (cloud_access_role_type_id, aws_iam_role_trust_policy, aws_trusted_account_numbers,
  aws_trusted_services, aws_partition, aws_create_instance_profile, aws_session_tags,
  and the project role's cloud_provider_ids). The state upgrader had been setting them to null.
  aws_session_tags also changed from a map to a list of tag objects, so kmigrate now
  rewrites it and the state upgrader converts the stored map.
time: 2026-11-02T19:53:47Z
