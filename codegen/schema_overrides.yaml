  custom_account:
    description: "Attaches a custom account to a project in Kion. If project_id is provided, the account will be added to the corresponding project, otherwise the account will be added to the account cache. Once added, an account can be moved between projects or in and out of the account cache by changing the project_id. When importing existing Kion accounts into terraform state, you can use one of these methods:  Default import (tries project first, then cache): terraform import kion_custom_account.example 123 Explicit project account import: terraform import kion_custom_account.example account_id=123 Explicit cache account import: terraform import kion_custom_account.example account_cache_id=123"
    # PATCH /v3/account/{id} has no account_number, and a custom account's
    # spend is matched to it, so a new number is a different account. #75.
    attributes:
      project_id:
        description: "ID of the project the account belongs to. Changing it moves the account in place through POST /v3/account/{id}/move rather than recreating it: Kion gives the account a new id, the resource adopts it, and the account's financial history stays with the old project (the move's preserve setting). The new project's cloud rules and cloud access roles apply after the move. Requires permission to manage accounts and projects."
      account_number:
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
  forecast:
    description: "Manages a Kion Forecast."
  forecast_category:
    description: "Manages a Kion Forecast Category."
  funding_source:
    description: "Manages a Kion Funding Source."
    attributes:
      permission_scheme_id:
        # GET /v3/funding-source omits it entirely.
        computed_optional_required: computed_optional
  gcp_account:
    description: "Creates or imports a Google Cloud Project and adds it to a Kion project or the Kion account cache. If create_mode is set to import, an existing project will be imported into Kion, otherwise if create_mode is set to create, a new GCP Project will be created.  If project_id is provided the account will be added to the corresponding project, otherwise the account will be added to the account cache. Once added, an account can be moved between projects or in and out of the account cache by changing the project_id.  When moving accounts between projects, use move_project_settings to control how financials will be treated between the old and new project. When importing an existing Kion account into terraform state (different from using terraform to import an existing GCP Project into Kion), you must use the account_id= or account_cache_id= ID prefix to indicate whether the ID is an account ID or a cached account ID. For example: terraform import kion_gcp_account.test-account account_id=123 terraform import kion_gcp_account.test-cached-account account_cache_id=321  NOTE: This resource requires Kion v3.8.4 or greater."
    # PATCH /v3/account/{id} has no google_cloud_project_id: pointing the
    # resource at a different GCP project is a different account. #75.
    attributes:
      project_id:
        description: "ID of the project the account belongs to. Changing it moves the account in place through POST /v3/account/{id}/move rather than recreating it: Kion gives the account a new id, the resource adopts it, and the account's financial history stays with the old project (the move's preserve setting). The new project's cloud rules and cloud access roles apply after the move. Requires permission to manage accounts and projects."
      google_cloud_project_id:
        computed_optional_required: computed_optional
        plan_modifiers:
          - stringplanmodifier.UseStateForUnknown()
          - stringplanmodifier.RequiresReplace()
  gcp_iam_role:
    description: "Manages a Kion Gcp Iam Role."
    attributes:
      role_permissions:
        # Returned for most roles but null for managed ones, so 27 of 1382
        # failed to import.
        computed_optional_required: computed_optional
  gcp_service_account:
    description: "Manages a Kion Gcp Service Account."
    # PATCH /v3/gcp/service-account/{id} has none of email, gcp_project_id or
    # unique_id: together they name the GCP service account, so a change is a
    # different one. #75.
    attributes:
      email:
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
      gcp_project_id:
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
      unique_id:
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
      oauth_client_secret:
        type: string
        computed_optional_required: computed_optional
        sensitive: true
        description: "OAuthClientSecret is the client secret for an oauth client in the service account's project"
  idms:
    description: "Manages a Kion Idms."
  idms_group_association:
    description: "Manages a Kion IDMS Group Association."
    # PATCH /v3/idms/group-association/{id} has no idms_id, so it forces
    # replacement. #75.
    attributes:
      idms_id:
        plan_modifiers:
          - int64planmodifier.UseStateForUnknown()
          - int64planmodifier.RequiresReplace()
  permission_scheme:
    description: "Manages a Kion Permission Scheme."
  project_line_item:
    description: "Manages a Kion Project Line Item."
  service_control_policy:
    description: "Manages a Kion Service Control Policy."
    attributes:
  user:
    description: "Manages a Kion User."
  webhook:
    description: "Manages a Kion Webhook."
    attributes:
  # Resources with no committed doc page before now, so no prior description
  # to carry forward.
  account_linkage:
    description: "Manages a Kion Account Linkage, associating an account with a project."
    # Kion publishes no update for a linkage, so the generated Update is a flat
    # error: "kion_account_linkage cannot be updated in place; changes force
    # replacement." Nothing made that happen, though -- no attribute required
    # replacement, so Terraform planned an in-place update and every change to a
    # linkage failed the apply instead of recreating it. (Kion itself does serve a
    # PATCH; the public spec does not declare it, so the SDK has no method for it.)
    attributes:
      azure_object_id:
        type: string
        computed_optional_required: required
        description: Azure Object ID of the user (UUID format).
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
      azure_principal_name:
        type: string
        computed_optional_required: required
        description: Azure Principal Name (UPN) of the user.
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
      payer_id:
        type: int64
        computed_optional_required: required
        description: ID of the payer this linkage is associated with.
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      user_id:
        type: int64
        computed_optional_required: required
        description: ID of the Kion user to link.
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
  billing_source_govcloud:
    description: "Manages the GovCloud information attached to an existing Kion commercial billing source. One per billing source, addressed by the commercial payer's id."
  funding_source_note:
    description: "Manages a Kion Funding Source Note."
  idms_open_id:
    description: "Manages a Kion OpenID Connect identity management system (IDMS)."
  ou_cloud_access_role_exemption:
    description: "Manages a Kion OU Cloud Access Role Exemption."
    # No update endpoint: the generated Update raises a diagnostic saying
    # changes force replacement. Nothing made that happen, though -- without
    # RequiresReplace, Terraform planned an in-place update and every change
    # failed the apply instead of recreating the resource. #75.
    attributes:
      ou_cloud_access_role_id:
        type: int64
        computed_optional_required: computed_optional
        description: "ID of the ou cloud access role in the application being exempted from."
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      ou_id:
        type: int64
        computed_optional_required: computed_optional
        description: "ID of the ou in the application."
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      reason:
        type: string
        computed_optional_required: computed_optional
        description: "Reason the Cloud Access Role is being exempted."
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
  ou_note:
    description: "Manages a Kion OU Note."
    # PATCH /v3/ou-note/{id} carries name and text only; the OU and author are
    # fixed at create. #75.
    attributes:
      ou_id:
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      create_user_id:
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
  project_cloud_access_role_exemption:
    description: "Manages a Kion Project Cloud Access Role Exemption."
    # No update endpoint: the generated Update raises a diagnostic saying
    # changes force replacement. Nothing made that happen, though -- without
    # RequiresReplace, Terraform planned an in-place update and every change
    # failed the apply instead of recreating the resource. #75.
    attributes:
      ou_cloud_access_role_id:
        type: int64
        computed_optional_required: computed_optional
        description: "ID of the ou cloud access role in the application being exempted from."
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      project_id:
        type: int64
        computed_optional_required: computed_optional
        description: "ID of the project in the application."
        plan_modifiers:
          - int64planmodifier.RequiresReplace()
      reason:
        type: string
        computed_optional_required: computed_optional
        description: "Reason the Cloud Access Role is being exempted."
        plan_modifiers:
          - stringplanmodifier.RequiresReplace()
  service_catalog:
    description: "Manages a Kion Service Catalog portfolio."

