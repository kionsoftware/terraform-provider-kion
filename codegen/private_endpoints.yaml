      - { tf: name, to: "azure_csp_customer.name", kind: string }
      - { tf: billing_start_date, to: "azure_csp_customer.billing_start_date", kind: datecode }
      - { tf: customer_id, to: "azure_csp_customer.customer_id", kind: string }
      - { tf: azure_csp_id, to: "azure_csp_customer.azure_csp_id", kind: int }
      - { tf: app_id, to: "azure_csp_customer.app_id", kind: string }
      - { tf: domain, to: "azure_csp_customer.domain", kind: string }
      - { tf: primary_management_group_azure_id, to: "azure_csp_customer.primary_management_group_azure_id", kind: string }
      - { tf: resource_group_creation, to: "azure_csp_customer.resource_group_creation", kind: bool }
      - { tf: subscription_creation, to: "azure_csp_customer.subscription_creation", kind: bool }
      - { tf: tenant_level_charge_attribution_account_id, to: "azure_csp_customer.tenant_level_charge_attribution_account_id", kind: int }
      - { tf: storage_container, to: "azure_csp_customer.storage_container", kind: string }
      - { tf: storage_prefix, to: "azure_csp_customer.storage_prefix", kind: string }
