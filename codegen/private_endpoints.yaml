  # Anthropic billing source (#53), the same `payer` kind as Azure. Kion calls
  # Anthropic on every create to resolve the organization from the Admin key, so
  # a real key is required even with skip_validation; organization_id is read
  # only. Both keys come back "REDACTED" (or "" when unset) and sending that back
  # keeps the stored key. Anthropic billing sources exist from Kion 3.16.
  billing_source_anthropic:
    reason: no public spec surface; every billing source type creates through /v1/payer/standalone
    create: { method: POST,   path: "/v1/payer/standalone",    spec: private }
    read:   { method: GET,    path: "/v1/payer/{id}",          spec: private }
    update: { method: PUT,    path: "/v1/payer/{id}",          spec: private }
    delete: { method: DELETE, path: "/v3/billing-source/{id}", spec: public }
    create_seed: '{"account_type_id": 30, "skip_validation": true}'
    min_kion_version: "3.16.0"
    read_shape:
      scalars:
        - { tf: id,                 from: "id",                                          kind: id }
        - { tf: name,               from: "anthropic_billing_source.name",               kind: string }
        - { tf: billing_start_date, from: "anthropic_billing_source.billing_start_date", kind: datecode }
        - { tf: organization_id,    from: "anthropic_billing_source.organization_id",    kind: string }
        - { tf: admin_api_key,      from: "anthropic_billing_source.admin_api_key",      kind: string, write_only: true }
        - { tf: analytics_api_key,  from: "anthropic_billing_source.analytics_api_key",  kind: string, write_only: true }
    write_shape:
      - { tf: name,               to: "anthropic_billing_source.name",               kind: string }
      - { tf: billing_start_date, to: "anthropic_billing_source.billing_start_date", kind: datecode }
      - { tf: admin_api_key,      to: "anthropic_billing_source.admin_api_key",      kind: string }
      - { tf: analytics_api_key,  to: "anthropic_billing_source.analytics_api_key",  kind: string }

  billing_source_gcp:
    reason: no public by-id read and no public update; private /v1/payer nests under gcp_billing_account
    create: { method: POST,   path: "/v3/billing-source/gcp",  spec: public }
    read:   { method: GET,    path: "/v1/payer/{id}",          spec: private }
    update: { method: PUT,    path: "/v1/payer/{id}",          spec: private }
    delete: { method: DELETE, path: "/v3/billing-source/{id}", spec: public }
    read_shape:
      scalars:
        # The payer id, not the nested record's own. /v1/payer/{id} answers on
        # the payer id and DELETE /v3/billing-source/{id} takes it; the nested
        # record carries a different one (payer 2 -> aws_payer.id 1). Reporting
        # the inner id would point destroy at another billing source.
        - { tf: id, from: "id", kind: id }
        - { tf: account_type_id, from: "account_type_id", kind: int }
      # Everything else lives inside the nested create object in the model, so it
      # is flattened as one object rather than as top-level scalars.
      objects:
        - tf: gcp_billing_account_create
          value_type: GcpBillingAccountCreateValue
          from: "gcp_billing_account.billing_account"
          subs:
            - { tf: name,               from: name,               kind: string }
            - { tf: gcp_id,             from: gcp_id,             kind: string }
            # YYYYMM on the wire, YYYY-MM in the schema. Declared int, it
            # handed an Int64 to a string attribute and every read failed.
            - { tf: billing_start_date, from: billing_start_date, kind: datecode }
            - { tf: is_reseller,        from: is_reseller,        kind: bool }
            - { tf: service_account_id, from: service_account_id, kind: int }
            # Required, so import needs it read rather than carried from state.
            - tf: big_query_export
              from: big_query_export
              kind: object
              subs:
                - { tf: gcp_project_id,  from: gcp_project_id,  kind: string }
                - { tf: dataset_name,    from: dataset_name,    kind: string }
                - { tf: table_name,      from: table_name,      kind: string }
                - { tf: table_format,    from: table_format,    kind: string }
                - { tf: focus_view_name, from: focus_view_name, kind: string }
            - { tf: billing_account_attribution_account_id, from: billing_account_attribution_account_id, kind: string, write_only: true }
            - { tf: use_focus,                              from: use_focus,                              kind: bool,   write_only: true }
            - { tf: use_proprietary,                        from: use_proprietary,                        kind: bool,   write_only: true }
    write_shape:
      - { tf: gcp_billing_account_create.name,                                   to: "gcp_billing_account_update.name",                                   kind: string }
      - { tf: gcp_billing_account_create.gcp_id,                                 to: "gcp_billing_account_update.gcp_id",                                 kind: string }
      - { tf: gcp_billing_account_create.billing_start_date,                     to: "gcp_billing_account_update.billing_start_date",                     kind: datecode }
      - { tf: gcp_billing_account_create.is_reseller,                            to: "gcp_billing_account_update.is_reseller",                            kind: bool }
      - { tf: gcp_billing_account_create.service_account_id,                     to: "gcp_billing_account_update.service_account_id",                     kind: int }
      - { tf: gcp_billing_account_create.billing_account_attribution_account_id, to: "gcp_billing_account_update.billing_account_attribution_account_id", kind: int }
      - { tf: gcp_billing_account_create.big_query_export.gcp_project_id,        to: "gcp_billing_account_update.big_query_export.gcp_project_id",        kind: string }
      - { tf: gcp_billing_account_create.big_query_export.dataset_name,          to: "gcp_billing_account_update.big_query_export.dataset_name",          kind: string }
      - { tf: gcp_billing_account_create.big_query_export.table_name,            to: "gcp_billing_account_update.big_query_export.table_name",            kind: string }
      - { tf: gcp_billing_account_create.big_query_export.table_format,          to: "gcp_billing_account_update.big_query_export.table_format",          kind: string }
      - { tf: gcp_billing_account_create.big_query_export.focus_view_name,       to: "gcp_billing_account_update.big_query_export.focus_view_name",       kind: string }
      - { tf: gcp_billing_account_create.use_focus,                              to: "use_focus_reports",                          kind: bool }
      - { tf: gcp_billing_account_create.use_proprietary,                        to: "use_proprietary_reports",                    kind: bool }

  service_catalog:
    reason: public surface is minimal; richer portfolio ops are private
    create: { method: POST,   path: "/v3/service-catalog",                    spec: public }
    read:   { method: GET,    path: "/v2/aws-service-catalog/portfolio/{id}", spec: private }
    delete: { method: DELETE, path: "/v2/aws-service-catalog/portfolio/{id}", spec: private }

  # Public /v3/*-cloud-access-role-exemption has create+delete but no read (a
  # by-id GET is 405). The records are returned by the parent's cloud access
  # role listing, GET /v1/{ou,project}/{id}/ou-cloud-access-role, under
  # data.ou_exemptions / data.project_exemptions as
  # {id, ou_id|project_id, ou_cloud_access_role_id, reason, ou_cloud_access_role}.
  # That list holds only the exemptions the parent itself owns, and only cloud
  # access role exemptions, so no discriminator is needed.
  #
  # The exemption list is populated only for a caller holding Browse All Cloud
  # Access Roles and Manage OU (Manage Project) on the parent; for anyone else
  # it comes back null and the record reads as gone.
  #
  # Both previously read /v1/{ou,project}/{id}/cloud-access-role-exemption,
  # which lists a different exemption kind tied to cloud rules, so a created
  # record was never found and every refresh dropped it from state (#80).
  ou_cloud_access_role_exemption:
    reason: no public read; the parent OU's private cloud access role listing
    create: { method: POST,   path: "/v3/ou-cloud-access-role-exemption",      spec: public }
    read:   { method: GET,    path: "/v1/ou/{id}/ou-cloud-access-role",        spec: private }
    delete: { method: DELETE, path: "/v3/ou-cloud-access-role-exemption/{id}", spec: public }
    parent_read:
      path: "/v1/ou/{parent_id}/ou-cloud-access-role"
      records: ou_exemptions
      parent_tf: ou_id
      parent_json: ou_id
      fields:
        - { tf: ou_cloud_access_role_id, from: ou_cloud_access_role_id, kind: int }
        - { tf: reason,                  from: reason,                  kind: string }

  # A project exemption exempts an OU cloud access role FOR a project, so it
  # keys on ou_cloud_access_role_id too.
  project_cloud_access_role_exemption:
    reason: no public read; the parent project's private cloud access role listing
    create: { method: POST,   path: "/v3/project-cloud-access-role-exemption",      spec: public }
    read:   { method: GET,    path: "/v1/project/{id}/ou-cloud-access-role",         spec: private }
    delete: { method: DELETE, path: "/v3/project-cloud-access-role-exemption/{id}", spec: public }
    parent_read:
      path: "/v1/project/{parent_id}/ou-cloud-access-role"
      records: project_exemptions
      parent_tf: project_id
      parent_json: project_id
      fields:
        - { tf: ou_cloud_access_role_id, from: ou_cloud_access_role_id, kind: int }
        - { tf: reason,                  from: reason,                  kind: string }

  # The third resource that had a no-op read, and the easy one: the spec has the
  # collection GET, POST and DELETE, but no by-id GET, so it too imported as an
  # empty shell. The collection is flat and public, so the read needs no parent
  # and the import id stays the plain id. Fields match the spec's AWSResourceTag,
  # verified live 2026-10-20 (#30): create, refresh, import, out-of-band delete.
  aws_resource_tag:
    reason: public spec has the collection GET but no by-id read
    parent_read:
      path: "/v3/aws-resource-tag"
      fields:
        - { tf: resource_key,   from: resource_key,   kind: string }
        - { tf: resource_value, from: resource_value, kind: string }

  # Example of the public/private DUPLICATE pattern. ou_note is fully covered by the
  # public spec (v3); a private v2 twin also exists. Listed to document the pattern
  # the codebase already uses (e.g. conns RawDelete for SDK-uncovered routes).
  ou_note:
    reason: fully public (v3); private v2 twin exists, reference only
    create: { method: POST,   path: "/v3/ou-note",      spec: public }
    read:   { method: GET,    path: "/v3/ou-note/{id}", spec: public }
    update: { method: PATCH,  path: "/v3/ou-note/{id}", spec: public }
    delete: { method: DELETE, path: "/v3/ou-note/{id}", spec: public }
    private_twin_delete: { method: DELETE, path: "/v2/ou-note/{id}" }

  # The public spec publishes no delete for either, so the generator emitted a
  # Delete that warns and removes the resource from state only -- every webhook
  # and user a configuration created survived `terraform destroy`, unreferenced
  # and undeletable through Terraform. The private route exists and works;
  # verified on a live 3.16 install, create -> GET 200 -> DELETE 200 -> GET 404.
  webhook:
    reason: public spec has no delete; the private v1 route deletes for real
    create: { method: POST,   path: "/v3/webhook",      spec: public }
    read:   { method: GET,    path: "/v3/webhook/{id}", spec: public }
    update: { method: PATCH,  path: "/v3/webhook/{id}", spec: public }
    delete: { method: DELETE, path: "/v1/webhook/{id}", spec: private }

  # kion_project is public throughout, but no public read returns its
  # permission_scheme_id. Its Read (internal/kgen/crud/project.gtpl) also calls
  # GET /v1/project/{id}/edit (private), taking project_app_policy[0].id.

  user:
    reason: public spec has no delete; the private v1 route deletes for real
    create: { method: POST,   path: "/v3/user",      spec: public }
    read:   { method: GET,    path: "/v3/user/{id}", spec: public }
    delete: { method: DELETE, path: "/v1/user/{id}", spec: private }
