# Settable attributes the provider accepts and never sends.
#
# Generated by: go test ./internal/kgen/bindaudit/ -update
# Guarded by:   TestNoDroppedRequestAttributes
#
# Each key is <package>.<attribute>:<op>. Its presence means the operation
# builds its request without reading that attribute, so configuring it has
# no effect. Most entries are a request body with no field for the
# attribute; the reason names the body so a reviewer can check.
#
# This is a ratchet over pre-existing debt, NOT a statement that any entry
# is acceptable. An entry marked TODO has not been triaged. Fixing one means
# either binding the attribute or, where the API genuinely cannot change it
# in place, marking it RequiresReplace -- which removes it from the update
# side of this audit for the right reason.
#
# Reasons are preserved across regeneration; new entries arrive as TODO.

