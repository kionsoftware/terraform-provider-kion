      project_id: "hcl:%[3]s"
      start_datecode: "2026-01"
  # portfolio_id is the AWS portfolio id, not a kion_service_catalog reference
  # (see codegen/references.yaml), so it comes from the environment.
  service_catalog:
    env_args: [KION_ACC_ACCOUNT_ID, KION_ACC_AWS_PORTFOLIO_ID, KION_ACC_AWS_REGION]
    create:
      account_id: "hcl:%[2]s"
