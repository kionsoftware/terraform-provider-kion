      customer_id: "00000000-0000-0000-0000-000000000001"
      app_id: "00000000-0000-0000-0000-000000000002"
      client_secret: "test-acc-placeholder"
      domain: "test-acc.onmicrosoft.com"
      storage_container: "test-acc"
      storage_prefix: "exports"
      storage_primary_endpoint: "https://testacc.blob.core.windows.net/"
      use_proprietary_reports: "true"
      skip_validation: "true"
    update:
