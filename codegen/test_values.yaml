# Sample create/update attribute values for generated acceptance tests, per
# resource. A resource with no entry here generates NO acceptance tests, which
# is how 107 of them ended up hand-maintained and out of the generator's reach.
#
# Values are the RHS of each HCL attribute, passed through
# fmt.Sprintf(..., rName, <env_args>, <extra_args>): use "%[1]s" where a value
# must be unique per run. Quoting follows the schema type, so write a string
# value bare.
#
# Keys per resource:
#   env_args   environment variables whose VALUES the config needs, in order,
#              readable as %[2]s, %[3]s, ... Use for anything install-specific.
#   fixtures   shared HCL builders in internal/acctest (e.g. FundingSourceConfig),
#              called with rName and prepended. Prefer these over copying a
#              parent chain into several entries.
#   prereqs    HCL emitted ahead of the resource under test, for a parent that
#              must exist first. Same Sprintf, so %[1]s works here too.
#   extra_args Go expressions appended to the Sprintf args, for a value the HCL
#              cannot state literally (kion_scope's alias is varchar(16) and
#              rName is 17 chars, so it uses acctest.ShortName(rName, 16)).
#   require_env  list of {name, reason}: prerequisites whose VALUES the config
#              does not use (a billing source the create checks for). Each
#              becomes acctest.RequireEnv(t, name, reason) in PreCheck, so the
#              test skips with "<name> must be set to <reason>". A variable
#              already in env_args is gated there; listing it twice is an error.
#   known_issues list of {issue, note, expect_non_empty_plan}: an open defect
#              the test is expected to surface, named in a comment atop the
#              generated file so a red test reads as a recorded finding.
#              expect_non_empty_plan: true sets ExpectNonEmptyPlan on every
#              apply step, for a defect that leaves the plan dirty. Remove the
#              entry when the issue closes.
#   create_only_unset  create_only attributes (crud_archetypes.yaml) this config
#              does not produce. Every other one is asserted set after create.
#   import_unrecoverable  list of {attr, reason}: attributes the read cannot
#              restore, so an import leaves them null. Each is left out of the
#              import step's verification, with its reason as a comment.
#
# A value prefixed "hcl:" is an expression, not a literal: emitted unquoted and
# asserted only for presence, since a reference like kion_project.test.id has no
# value until apply. Use it for references, jsonencode bodies, and nested
# objects. A list or set is asserted by element count (name.#): the count when
# the value is a plain [a, b] literal, presence of the count otherwise.
# Everything else is compared against the value the config used, so a
# resource that accepts an attribute and discards it fails the test.
resources:
  # payer_id is optional in the schema and the spec, and REQUIRED by
  # POST /v3/category. %[2]s is the KION_ACC_BILLING_SOURCE_ID value.
  category:
    env_args: [KION_ACC_BILLING_SOURCE_ID]
    create:
      name: "test-acc-%[1]s"
      payer_id: "%[2]s"
    update:
      name: "test-acc-%[1]s-upd"
      payer_id: "%[2]s"
  oauth2_client:
    create:
      name: "test-acc-%[1]s"
      description: "terraform acceptance test"
      grant_types: "hcl:[\"authorization_code\"]"
      redirect_uris: "hcl:[\"https://example.com/callback\"]"
      allowed_scopes: "hcl:[\"api\"]"
      is_public: "false"
    update:
      name: "test-acc-%[1]s"
      description: "terraform acceptance test (updated)"
      grant_types: "hcl:[\"authorization_code\"]"
      redirect_uris: "hcl:[\"https://example.com/callback\", \"https://example.com/cb2\"]"
      allowed_scopes: "hcl:[\"api\"]"
      is_public: "false"
  label:
    create:
      color: "#0088ff"
      key: "test-acc-%[1]s"
      value: "test-acc-%[1]s"
    update:
      color: "#ff0000"
      key: "test-acc-%[1]s-upd"
      value: "test-acc-%[1]s-upd"
  account_cache:
    # An account_number imports that account into the cache. It must be in the
    # payer's AWS Organization and not already in Kion, which nothing on an
    # install lists, so it is its own variable: KION_ACC_AWS_ACCOUNT_NUMBER
    # names an account Kion already manages, and importing it always collides.
    # Without account_number the resource creates a real AWS account instead,
    # which no test should do.
    env_args: [KION_ACC_PAYER_ID, KION_ACC_UNMANAGED_AWS_ACCOUNT_NUMBER]
    create:
      account_name: "%[1]s"
      account_number: "%[3]s"
      account_type_id: "1"
      payer_id: "hcl:%[2]s"
    update:
      account_name: "%[1]s-updated"
      account_number: "%[3]s"
      account_type_id: "1"
      payer_id: "hcl:%[2]s"
  ami:
    env_args: [KION_ACC_ACCOUNT_ID, KION_ACC_AWS_AMI_ID]
    create:
      account_id: "hcl:%[2]s"
      aws_ami_id: "%[3]s"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      region: "us-east-1"
    update:
      account_id: "hcl:%[2]s"
      aws_ami_id: "%[3]s"
      description: "test-acc-updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      region: "us-east-1"
  app_api_key:
    create:
      name: "%[1]s"
    update:
      name: "%[1]s"
  # Creating an ARM template makes Kion validate a deployment into a real
  # resource group, so it needs an Azure billing source whose tenant exposes a
  # subscription; without one the API answers an opaque 500.
  azure_arm_template:
    env_args: [KION_ACC_AZURE_REGION_ID]
    require_env:
      - name: KION_ACC_AZURE_PAYER_ID
        reason: the ID of an Azure billing source on the target Kion
      - name: KION_ACC_AZURE_SUBSCRIPTION_UUID
        reason: an Azure subscription UUID the payer's tenant exposes; ARM template validation deploys into one
    create:
      template: "hcl:jsonencode({ \"$schema\" = \"https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#\", contentVersion = \"1.0.0.0\", resources = [] })"
      deployment_mode: "1"
      description: "test-acc ARM template"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      resource_group_name: "%[1]s-rg"
      resource_group_region_id: "hcl:%[2]s"
    update:
      template: "hcl:jsonencode({ \"$schema\" = \"https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#\", contentVersion = \"1.0.0.0\", resources = [] })"
      deployment_mode: "1"
      description: "test-acc ARM template updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      resource_group_name: "%[1]s-rg"
      resource_group_region_id: "hcl:%[2]s"
  azure_policy:
    create:
      azure_policy: "hcl:{ name = \"%[1]s\", description = \"test-acc Azure policy\", policy = jsonencode({ policyRule = { if = { field = \"type\", equals = \"Microsoft.Resources/subscriptions\" }, then = { effect = \"audit\" } } }) }"
      owner_users: "hcl:[1]"
    update:
      azure_policy: "hcl:{ name = \"%[1]s\", description = \"test-acc Azure policy updated\", policy = jsonencode({ policyRule = { if = { field = \"type\", equals = \"Microsoft.Resources/subscriptions\" }, then = { effect = \"audit\" } } }) }"
      owner_users: "hcl:[1]"
  azure_role:
    require_env:
      - name: KION_ACC_AZURE_PAYER_ID
        reason: an Azure billing source on this install; POST /v3/azure-role returns 500 without one
    import_unrecoverable:
      - attr: role_permissions
        reason: an import has no configured text to keep, so it reads Kion's canonical JSON, which is equivalent to but not textually the configured value
    create:
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      role_permissions: "hcl:jsonencode({ actions = [\"Microsoft.Resources/subscriptions/read\"], notActions = [] })"
    update:
      car_restricted_user_group_ids: "hcl:[]"
      name: "%[1]s"
      owner_user_group_ids: "hcl:[]"
      owner_user_ids: "hcl:[1]"
      role_permissions: "hcl:jsonencode({ actions = [\"Microsoft.Resources/subscriptions/resourceGroups/read\"], notActions = [] })"
  budget:
    prereqs: |
      resource "kion_ou" "test_ou" {
        name = "test-acc-ou-%[1]s"
        owner_user_ids = [1]
        parent_ou_id = 0
        permission_scheme_id = 2
      }
    create:
      amount: "1000"
      end_datecode: "2026-12"
      ou_id: "hcl:kion_ou.test_ou.id"
      start_datecode: "2026-01"
  cft:
    import_unrecoverable:
      - attr: tags
        reason: an import has no configured order to keep, so it reads Kion's creation order, which the update step's reorder no longer matches
    create:
      policy: "hcl:jsonencode({ AWSTemplateFormatVersion = \"2010-09-09\", Description = \"test-acc\", Resources = { Topic = { Type = \"AWS::SNS::Topic\" } } })"
      description: "test-acc CFT"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      regions: "hcl:[\"us-east-1\"]"
      tags: "hcl:[{ tag_key = \"team\", tag_value = \"test-acc\" }, { tag_key = \"env\", tag_value = \"test\" }]"
    update:
      policy: "hcl:jsonencode({ AWSTemplateFormatVersion = \"2010-09-09\", Description = \"test-acc\", Resources = { Topic = { Type = \"AWS::SNS::Topic\" } } })"
      description: "test-acc CFT updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      regions: "hcl:[\"us-east-1\"]"
      tags: "hcl:[{ tag_key = \"env\", tag_value = \"test\" }, { tag_key = \"team\", tag_value = \"test-acc\" }]"
  cloud_rule:
    create:
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
    update:
      concurrent_cft_sync: "true"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
  compliance_check:
    create:
      cloud_provider_id: "1"
      compliance_check_type_id: "1"
      description: "test-acc compliance check"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      severity_type_id: "3"
    update:
      cloud_provider_id: "1"
      compliance_check_type_id: "1"
      description: "test-acc compliance check updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      severity_type_id: "4"
      regions: "hcl:[]"
  compliance_family:
    prereqs: |
      resource "kion_compliance_program" "test_program" {
        name = "test-acc-program-%[1]s"
        version = "1.0"
      }
    create:
      compliance_program_id: "hcl:kion_compliance_program.test_program.id"
      name: "%[1]s"
  compliance_level:
    prereqs: |
      resource "kion_compliance_program" "test_program" {
        name = "test-acc-program-%[1]s"
        version = "1.0"
      }
    create:
      compliance_program_id: "hcl:kion_compliance_program.test_program.id"
      name: "%[1]s"
  compliance_program:
    create:
      name: "%[1]s"
      version: "1.0"
  compliance_standard:
    create:
      created_by_user_id: "1"
      description: "test-acc compliance standard"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
    update:
      created_by_user_id: "1"
      description: "test-acc compliance standard updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
  custom_variable:
    create:
      default_value_string: "test-acc-default"
      description: "test-acc custom variable"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      type: "string"
    update:
      default_value_string: "test-acc-default-updated"
      description: "test-acc custom variable updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      type: "string"
  gcp_iam_role:
    create:
      gcp_role_launch_stage: "2"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      role_permissions: "hcl:[\"resourcemanager.projects.get\"]"
    update:
      car_restricted_user_group_ids: "hcl:[]"
      gcp_role_launch_stage: "2"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      role_permissions: "hcl:[\"resourcemanager.projects.get\"]"
  # The record stands for a Google-issued service account, so the email comes
  # from the install. The create rejects a unique_id already on record, so it
  # is per-run. The PATCH body carries none of email/gcp_project_id/unique_id
  # (ratcheted in codegen/unbound_attributes.yaml), so the update step changing
  # them surfaces that debt.
  gcp_service_account:
    env_args: [KION_ACC_GCP_SERVICE_ACCOUNT_EMAIL]
    create:
      email: "%[2]s"
      enable_federation_support: "false"
      gcp_project_id: "test-acc-value"
      name: "%[1]s"
      unique_id: "test-acc-%[1]s"
    update:
      description: "test-acc-updated"
      email: "%[2]s"
      enable_federation_support: "true"
      gcp_project_id: "test-acc-updated"
      name: "%[1]s"
      unique_id: "test-acc-%[1]s-upd"
  iam_policy:
    import_unrecoverable:
      - attr: policy
        reason: an import has no configured text to keep, so it reads Kion's canonical JSON, which is equivalent to but not textually the configured value
    create:
      policy: "hcl:jsonencode({ Version = \"2012-10-17\", Statement = [{ Effect = \"Deny\", Action = \"s3:*\", Resource = \"*\" }] })"
      description: "test-acc IAM policy"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
    update:
      policy: 'hcl:"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\"Effect\": \"Deny\", \"Action\": \"s3:*\", \"Resource\": \"*\"}\n  ]\n}\n"'
      description: "test-acc IAM policy updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
  idms:
    create:
      idms_type_id: "1"
      name: "%[1]s"
      password_expiration: "90"
    update:
      idms_type_id: "1"
      name: "%[1]s"
      password_expiration: "60"
  idms_group_association:
    env_args: [KION_ACC_SAML_IDMS_ID]
    create:
      assertion_name: "%[1]s"
      assertion_regex: "^test-acc$"
      idms_id: "hcl:%[2]s"
      update_on_login: "false"
      user_group_id: "1"
    update:
      assertion_name: "%[1]s"
      assertion_regex: "^test-acc-upd$"
      idms_id: "hcl:%[2]s"
      update_on_login: "true"
      user_group_id: "1"
  idms_open_id:
    create:
      authorization_endpoint: "https://test-acc.invalid/auth"
      client_id: "test-acc-client"
      email_claim: "email"
      first_name_claim: "given_name"
      issuer: "https://test-acc.invalid"
      jwks_uri: "https://test-acc.invalid/jwks"
      last_name_claim: "family_name"
      name: "%[1]s"
      phone_claim: "phone_number"
      scopes: "hcl:[\"openid\", \"email\"]"
      username_claim: "sub"
    update:
      authorization_endpoint: "https://test-acc.invalid/auth"
      client_id: "test-acc-client-upd"
      email_claim: "email"
      first_name_claim: "given_name"
      issuer: "https://test-acc.invalid"
      jwks_uri: "https://test-acc.invalid/jwks"
      last_name_claim: "family_name"
      name: "%[1]s-upd"
      phone_claim: "phone_number"
      scopes: "hcl:[\"openid\", \"email\"]"
      username_claim: "sub"
  service_control_policy:
    import_unrecoverable:
      - attr: policy
        reason: an import has no configured text to keep, so it reads Kion's canonical JSON, which is equivalent to but not textually the configured value
    create:
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      policy: "hcl:jsonencode({ Version = \"2012-10-17\", Statement = [{ Effect = \"Deny\", Action = \"s3:*\", Resource = \"*\" }] })"
    update:
      description: "test-acc-updated"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
      policy: 'hcl:"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\"Effect\": \"Deny\", \"Action\": \"ec2:*\", \"Resource\": \"*\"}\n  ]\n}\n"'
  user_group:
    create:
      description: "test-acc user group"
      idms_id: "1"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
    update:
      description: "test-acc user group updated"
      idms_id: "1"
      name: "%[1]s"
      owner_user_ids: "hcl:[1]"
  azure_account:
    env_args: [KION_ACC_AZURE_PAYER_ID, KION_ACC_AZURE_SUBSCRIPTION_UUID]
    prereqs: |
      resource "kion_permission_scheme" "test_perm" {
        name = "%[1]s-perm"
        type = "ou"
      }
      resource "kion_ou" "test_ou" {
        name                 = "%[1]s-ou"
        parent_ou_id         = 0
        permission_scheme_id = kion_permission_scheme.test_perm.id
        owner_user_ids       = [1]
      }
      resource "kion_permission_scheme" "test_perm_project" {
        name = "%[1]s-perm-project"
        type = "project"
      }
      resource "kion_project" "test_project" {
        name                 = "%[1]s-project"
        ou_id                = kion_ou.test_ou.id
        permission_scheme_id = kion_permission_scheme.test_perm_project.id
        owner_user_ids       = [1]
      }
    create:
      account_name: "%[1]s"
      payer_id: "hcl:%[2]s"
      project_id: "hcl:kion_project.test_project.id"
      start_datecode: "2025-01"
      subscription_uuid: "%[3]s"
    update:
      account_name: "%[1]s-updated"
      payer_id: "hcl:%[2]s"
      project_id: "hcl:kion_project.test_project.id"
      start_datecode: "2025-01"
      subscription_uuid: "%[3]s"
  compliance_control:
    prereqs: |
      resource "kion_compliance_program" "test_program" {
        name = "test-acc-program-%[1]s"
        version = "1.0"
      }
      resource "kion_compliance_family" "test_family" {
        compliance_program_id = kion_compliance_program.test_program.id
        name = "test-acc-family-%[1]s"
      }
    create:
      compliance_family_id: "hcl:kion_compliance_family.test_family.id"
      control_number: "1"
      description: "test-acc control"
      name: "%[1]s"
      program_id: "hcl:kion_compliance_program.test_program.id"
      severity: "low"
      title: "test-acc control title"
    update:
      arm_template_definition_ids: "hcl:[]"
      compliance_family_id: "hcl:kion_compliance_family.test_family.id"
      control_number: "1"
      description: "test-acc control"
      name: "%[1]s"
      program_id: "hcl:kion_compliance_program.test_program.id"
      severity: "low"
      title: "test-acc control title"
  custom_account:
    env_args: [KION_ACC_CUSTOM_PAYER_ID, KION_ACC_CUSTOM_ACCOUNT_NUMBER]
    prereqs: |
      resource "kion_permission_scheme" "test_perm" {
        name = "%[1]s-perm"
        type = "ou"
      }
      resource "kion_ou" "test_ou" {
        name                 = "%[1]s-ou"
        parent_ou_id         = 0
        permission_scheme_id = kion_permission_scheme.test_perm.id
        owner_user_ids       = [1]
      }
      resource "kion_permission_scheme" "test_perm_project" {
        name = "%[1]s-perm-project"
        type = "project"
      }
      resource "kion_project" "test_project" {
        name                 = "%[1]s-project"
        ou_id                = kion_ou.test_ou.id
        permission_scheme_id = kion_permission_scheme.test_perm_project.id
        owner_user_ids       = [1]
      }
    create:
      account_name: "%[1]s"
      account_number: "%[3]s"
      payer_id: "hcl:%[2]s"
      project_id: "hcl:kion_project.test_project.id"
      start_datecode: "2025-01"
    update:
      account_name: "%[1]s-updated"
      account_number: "%[3]s"
      payer_id: "hcl:%[2]s"
      project_id: "hcl:kion_project.test_project.id"
      start_datecode: "2025-01"
  funding_source:
    prereqs: |
      resource "kion_permission_scheme" "test_perm" {
        name = "%[1]s-perm"
        type = "ou"
      }
      resource "kion_permission_scheme" "test_fs_perm" {
        name = "%[1]s-fs-perm"
        type = "funding_source"
      }
      resource "kion_ou" "test_ou" {
        name                 = "%[1]s-ou"
        parent_ou_id         = 0
        permission_scheme_id = kion_permission_scheme.test_perm.id
        owner_user_ids       = [1]
      }
    create:
      amount: "1000"
      end_datecode: "2026-12"
      name: "%[1]s"
      ou_id: "hcl:kion_ou.test_ou.id"
      owner_user_ids: "hcl:[1]"
      permission_scheme_id: "hcl:kion_permission_scheme.test_fs_perm.id"
      start_datecode: "2026-01"
    update:
      amount: "2000"
      description: "test-acc-updated"
      end_datecode: "2027-12"
      name: "%[1]s"
      ou_id: "hcl:kion_ou.test_ou.id"
      owner_user_ids: "hcl:[1]"
      permission_scheme_id: "hcl:kion_permission_scheme.test_fs_perm.id"
      start_datecode: "2026-01"
  idms_open_id_access_rule:
    prereqs: |
      resource "kion_idms_open_id" "test" {
        name                   = "%[1]s-idms"
        client_id              = "test-acc-client"
        issuer                 = "https://test-acc.invalid"
        authorization_endpoint = "https://test-acc.invalid/auth"
        jwks_uri               = "https://test-acc.invalid/jwks"
        scopes                 = ["openid", "email"]
        username_claim         = "sub"
        email_claim            = "email"
        first_name_claim       = "given_name"
        last_name_claim        = "family_name"
        phone_claim            = "phone_number"
      }
    create:
      assertion_name: "test-acc-assertion"
      assertion_regex: ".*"
      cloudtamer_access_level_id: "1"
      open_id_id: "hcl:kion_idms_open_id.test.id"
    update:
      assertion_name: "test-acc-assertion"
      assertion_regex: "^test-acc.*$"
      cloudtamer_access_level_id: "1"
      open_id_id: "hcl:kion_idms_open_id.test.id"
  idms_open_id_group_association:
    prereqs: |
      resource "kion_idms_open_id" "test" {
        name                   = "%[1]s-idms"
        client_id              = "test-acc-client"
        issuer                 = "https://test-acc.invalid"
        authorization_endpoint = "https://test-acc.invalid/auth"
        jwks_uri               = "https://test-acc.invalid/jwks"
        scopes                 = ["openid", "email"]
        username_claim         = "sub"
        email_claim            = "email"
        first_name_claim       = "given_name"
        last_name_claim        = "family_name"
        phone_claim            = "phone_number"
      }
    create:
      assertion_name: "test-acc-assertion"
      assertion_regex: ".*"
      open_id_id: "hcl:kion_idms_open_id.test.id"
      update_on_login: "true"
      user_group_id: "1"
    update:
