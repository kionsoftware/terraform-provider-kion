name: golangci-lint
on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --issues-exit-code=1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      # Acceptance tests skip themselves unless TF_ACC is set, so this needs no
      # Kion instance and no secrets.
      - name: Run Tests
        run: go test -race -count=1 ./...
